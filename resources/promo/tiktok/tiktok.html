<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Spot TikTok AFRICA'SPY</title>
<style>

@font-face{font-family:Rajdhani;font-weight:600;src:url(img/rajdhani-600.woff2)}
@font-face{font-family:Rajdhani;font-weight:700;src:url(img/rajdhani-700.woff2)}
@font-face{font-family:Inter;src:url(img/inter-400.woff2)}
@font-face{font-family:Mono;src:url(img/share-tech-mono-400.woff2)}
:root{--cyan:#00C8FF;--blue:#087CFF;--turq:#00F0D0;--green:#1AFF9C;--silver:#AEBBC9;--gold:#D5B36A;--white:#E8F2FA;--red:#FF4057;--violet:#865DFF;--line:#293444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05070B;color:var(--white);font-family:Inter,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(900px 1200px at 50% 38%,#0C1828 0%,#05070B 75%)}
.grid{position:absolute;inset:-120px;background-image:linear-gradient(rgba(0,200,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.055) 1px,transparent 1px);background-size:54px 54px}
canvas{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
/* Zone utile : x 60 à 940 (colonne d'icônes TikTok à droite), y 260 à 1300 ; sous-titres 1330 à 1530 */
.col{position:absolute;left:60px;width:880px}
.eyebrow{font:400 26px Mono;letter-spacing:.32em;color:var(--turq);text-transform:uppercase}
.big{font:900 88px/1.08 Orbitron;letter-spacing:.02em}
.h2{font:700 72px/1.02 Rajdhani}
.chip{display:inline-block;padding:14px 26px;border-radius:40px;border:2px solid rgba(0,200,255,.5);font:700 34px Rajdhani;letter-spacing:.06em;margin:0 12px 16px 0;background:rgba(5,7,11,.7)}
.pt{display:flex;align-items:center;gap:22px;font:700 44px/1.1 Rajdhani;margin-top:26px}
.pt i{flex:none;width:22px;height:22px;transform:rotate(45deg);border:4px solid currentColor}
#brand{position:absolute;left:60px;top:150px;display:flex;align-items:center;gap:16px}
#brand .lg{width:64px;height:64px}
#brand b{font:900 34px Orbitron;letter-spacing:.14em}
#brand small{display:block;font:400 15px Mono;letter-spacing:.34em;color:var(--gold)}
#bar{position:absolute;left:60px;width:880px;top:238px;height:6px;display:flex;gap:6px}
#bar span{flex:1;background:rgba(41,52,68,.9);border-radius:3px;overflow:hidden}
#bar span b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--turq))}
#cap{position:absolute;left:60px;width:880px;top:1390px;text-align:center}
#cap span{display:inline-block;padding:16px 28px;border-radius:18px;background:rgba(3,6,10,.82);border:1px solid rgba(0,200,255,.28);font:700 54px/1.18 Rajdhani;color:#fff;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#cap em{font-style:normal;color:var(--gold)}

.phone .v{position:absolute;inset:16px;border-radius:42px;overflow:hidden}
.phone img{position:absolute;left:0;top:0;width:100%}
.cover{position:absolute;left:0;top:0;width:1080px;height:760px;overflow:hidden}
.cover img{position:absolute;left:-60px;top:0;width:1200px;height:760px;object-fit:cover}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,11,.15) 0%,rgba(5,7,11,.0) 40%,#05070B 98%)}

.dots{position:absolute;left:60px;top:1230px;display:flex;gap:14px}
.dots span{width:94px;height:58px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font:900 28px Orbitron;color:#4A5666}

.tile svg{width:64px;height:64px}
.tile b{display:block;margin-top:18px;font:700 40px/1.1 Rajdhani}
.btn{display:inline-block;padding:34px 70px;border-radius:20px;background:linear-gradient(135deg,var(--blue),var(--cyan));font:700 50px Rajdhani;letter-spacing:.16em;color:#031019;box-shadow:0 0 60px rgba(0,200,255,.45)}
.small{font:400 22px/1.5 Inter;color:rgba(174,187,201,.85)}
.map svg{width:100%;height:auto;display:block}
.map .country{fill:rgba(0,200,255,.07);stroke:rgba(0,200,255,.75);stroke-width:1.2}
.map .graticule{stroke:rgba(0,200,255,.12);stroke-width:1;fill:none}
#scan{position:absolute;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,var(--cyan),var(--turq),transparent);box-shadow:0 0 30px 8px rgba(0,200,255,.45);opacity:0}
</style></head>

<script>
